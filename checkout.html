<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Awwalu Kitchen Vault - Checkout</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="styles.css" />
    <style>
        .coupon-section {
            background: #faf8f5;
            padding: 16px 20px;
            border-radius: 12px;
            margin: 16px 0 24px;
            border: 1px solid #f0ebe4;
        }

        .coupon-section h3 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #2d2a24;
        }

        .coupon-input-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .coupon-input-group input {
            flex: 1;
            padding: 10px 16px;
            border: 2px solid #f0ebe4;
            border-radius: 8px;
            font-size: 14px;
            background: #fff;
            min-width: 150px;
        }

        .coupon-input-group input:focus {
            outline: none;
            border-color: #b8860b;
        }

        .coupon-input-group .btn-sm {
            padding: 10px 20px;
            font-size: 14px;
            background: #b8860b;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .coupon-input-group .btn-sm:hover {
            background: #d4a22a;
        }

        .coupon-message {
            margin-top: 8px;
            font-size: 14px;
        }

        .coupon-message.success {
            color: #065f46;
        }

        .coupon-message.error {
            color: #991b1b;
        }

        .discount-display {
            margin-top: 8px;
            font-weight: 600;
            color: #b8860b;
            display: none;
            justify-content: space-between;
        }

        .checkout-total-final {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 16px;
            margin-top: 16px;
            border-top: 2px solid #f0ebe4;
            font-size: 20px;
            font-weight: 700;
            color: #2d2a24;
        }

        .checkout-total-final span:last-child {
            color: #b8860b;
        }
    </style>
</head>

<body>
    <nav class="navbar" id="navbar"></nav>

    <section class="section checkout-section">
        <div class="container">
            <h2 class="section-title"><i class="fas fa-clipboard-list"></i> Checkout</h2>
            <div class="checkout-wrapper" id="checkoutWrapper">
                <!-- Order Summary -->
                <div class="checkout-summary">
                    <h3><i class="fas fa-shopping-cart"></i> Your Order</h3>
                    <div id="checkoutItems">
                        <p style="color:#8a8078; text-align:center; padding:20px 0;"><i
                                class="fas fa-spinner spinner"></i> Loading...</p>
                    </div>
                    <div class="checkout-total" id="checkoutTotalWrap">
                        <span>Total:</span>
                        <span id="checkoutTotal">₦0.00</span>
                    </div>
                    <!-- Coupon Section -->
                    <div class="coupon-section">
                        <h3><i class="fas fa-tag"></i> Have a Coupon?</h3>
                        <div class="coupon-input-group">
                            <input type="text" id="couponCode" placeholder="Enter coupon code" />
                            <button id="applyCouponBtn" class="btn-sm">Apply</button>
                        </div>
                        <div id="couponMessage" class="coupon-message"></div>
                        <div id="discountDisplay" class="discount-display">
                            <span>Discount:</span>
                            <span id="discountAmount">-₦0.00</span>
                        </div>
                        <div class="checkout-total-final" id="finalTotalWrap" style="display:none;">
                            <span>Final Total:</span>
                            <span id="finalTotalAmount">₦0.00</span>
                        </div>
                    </div>
                </div>
                <!-- Customer Info Form -->
                <div class="checkout-form">
                    <h3><i class="fas fa-user"></i> Personal Information</h3>
                    <form id="checkoutForm" novalidate>
                        <div class="form-group">
                            <label for="fullName">Full Name <span class="required">*</span></label>
                            <input type="text" id="fullName" placeholder="e.g. Awwalu Mohammed" required />
                        </div>
                        <div class="form-group">
                            <label for="phoneNumber">Phone Number <span class="required">*</span></label>
                            <input type="tel" id="phoneNumber" placeholder="e.g. 08086111492" required />
                        </div>
                        <div class="form-group">
                            <label for="email">Email Address</label>
                            <input type="email" id="email" placeholder="e.g. awwalu@example.com" />
                        </div>
                        <div class="form-group">
                            <label for="deliveryAddress">Delivery Address <span class="required">*</span></label>
                            <textarea id="deliveryAddress" rows="3" placeholder="Enter your full delivery address"
                                required></textarea>
                        </div>
                        <div class="form-group">
                            <label for="deliveryNotes">Delivery Notes (Optional)</label>
                            <textarea id="deliveryNotes" rows="2" placeholder="Any special instructions?"></textarea>
                        </div>
                        <button type="submit" class="btn-primary btn-checkout">
                            <i class="fab fa-whatsapp"></i> Place Order via WhatsApp
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer" id="footer"></footer>
    <script src="script.js"></script>
    <script>
        // Load components
        loadNavbar();
        loadFooter();
        updateCartBadge();

        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('product');

        let orderItems = [];
        let orderTotal = 0;
        let finalTotal = 0;
        let appliedCoupon = null;
        let discountAmount = 0;

        const checkoutItems = document.getElementById('checkoutItems');
        const checkoutTotal = document.getElementById('checkoutTotal');
        const checkoutWrapper = document.getElementById('checkoutWrapper');
        const couponCodeInput = document.getElementById('couponCode');
        const applyCouponBtn = document.getElementById('applyCouponBtn');
        const couponMessage = document.getElementById('couponMessage');
        const discountDisplay = document.getElementById('discountDisplay');
        const discountAmountSpan = document.getElementById('discountAmount');
        const finalTotalWrap = document.getElementById('finalTotalWrap');
        const finalTotalAmount = document.getElementById('finalTotalAmount');

        async function fetchProductById(id) {
            try {
                const res = await fetch(`${API_BASE}/products/${id}`);
                if (!res.ok) throw new Error('Product not found');
                return await res.json();
            } catch { return null; }
        }

        async function loadOrderItems() {
            let cartItems = getCart();
            if (productId) {
                const product = await fetchProductById(productId);
                if (product) orderItems = [{ ...product, quantity: 1 }];
                else { showToast('❌ Product not found.'); window.location.href = 'products.html'; return; }
            } else if (cartItems.length) {
                orderItems = cartItems;
            } else {
                checkoutWrapper.innerHTML = `
                    <div style="text-align:center; padding:60px 0; max-width:500px; margin:0 auto; grid-column:1/-1;">
                        <i class="fas fa-shopping-cart" style="font-size:64px; color:#d4c9be;"></i>
                        <p style="font-size:20px; margin-top:16px; color:#8a8078;">Your cart is empty</p>
                        <a href="products.html" class="btn-primary" style="display:inline-block;"><i class="fas fa-arrow-left"></i> Browse Products</a>
                    </div>
                `;
                return;
            }
            renderOrderItems();
        }

        function renderOrderItems() {
            if (!orderItems.length) return;
            let html = '', total = 0;
            orderItems.forEach(item => {
                const qty = item.quantity || 1;
                const price = parseFloat(item.price.replace(/[^0-9.]/g, '') || 0);
                total += price * qty;
                html += `
                    <div class="checkout-item">
                        <div class="checkout-item-info">
                            <img src="${item.image || 'https://via.placeholder.com/50x50?text=No+Image'}" alt="${item.name}" onerror="this.src='https://via.placeholder.com/50x50?text=No+Image'" />
                            <div><strong>${item.name}</strong> <span>${item.price}</span></div>
                        </div>
                        <span class="checkout-item-qty">×${qty}</span>
                    </div>
                `;
            });
            checkoutItems.innerHTML = html;
            orderTotal = total;
            finalTotal = total;
            checkoutTotal.textContent = `₦${total.toFixed(2)}`;
            window.orderTotal = total;
            window.orderFinalTotal = total;
        }

        applyCouponBtn.addEventListener('click', async function () {
            const code = couponCodeInput.value.trim();
            if (!code) { showToast('Please enter a coupon code.'); return; }
            const currentTotal = window.orderTotal || orderTotal || 0;
            try {
                const res = await fetch(`${API_BASE}/validate-coupon?code=${encodeURIComponent(code)}&total=${currentTotal}`);
                const data = await res.json();
                couponMessage.textContent = '';
                couponMessage.className = 'coupon-message';
                if (data.valid) {
                    let discount = data.discount_type === 'percentage' ? (orderTotal * data.discount_value) / 100 : data.discount_value;
                    discount = Math.min(discount, orderTotal);
                    discountAmount = discount;
                    appliedCoupon = data;
                    couponMessage.textContent = `✅ Coupon applied! You saved ₦${discount.toFixed(2)}`;
                    couponMessage.className = 'coupon-message success';
                    discountDisplay.style.display = 'flex';
                    discountAmountSpan.textContent = `-₦${discount.toFixed(2)}`;
                    finalTotal = orderTotal - discount;
                    finalTotalWrap.style.display = 'flex';
                    finalTotalAmount.textContent = `₦${finalTotal.toFixed(2)}`;
                    checkoutTotal.textContent = `₦${orderTotal.toFixed(2)}`;
                    window.orderFinalTotal = finalTotal;
                } else {
                    couponMessage.textContent = `❌ ${data.reason || 'Invalid coupon'}`;
                    couponMessage.className = 'coupon-message error';
                    discountAmount = 0;
                    appliedCoupon = null;
                    discountDisplay.style.display = 'none';
                    finalTotalWrap.style.display = 'none';
                    checkoutTotal.textContent = `₦${orderTotal.toFixed(2)}`;
                    window.orderFinalTotal = orderTotal;
                }
            } catch (error) {
                console.error('Coupon validation error:', error);
                showToast('Failed to validate coupon. Please try again.');
            }
        });

        document.getElementById('checkoutForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const fullName = document.getElementById('fullName').value.trim();
            const phoneNumber = document.getElementById('phoneNumber').value.trim();
            const email = document.getElementById('email').value.trim();
            const deliveryAddress = document.getElementById('deliveryAddress').value.trim();
            const deliveryNotes = document.getElementById('deliveryNotes').value.trim();
            if (!fullName || !phoneNumber || !deliveryAddress) {
                showToast('❌ Please fill in all required fields.');
                return;
            }
            if (phoneNumber.length < 10) {
                showToast('❌ Please enter a valid phone number.');
                return;
            }
            const total = window.orderFinalTotal || orderTotal || 0;
            let message = '🛒 *Awwalu Kitchen Vault - Order*%0A%0A';
            message += '*Customer Information:*%0A';
            message += `Name: ${fullName}%0A`;
            message += `Phone: ${phoneNumber}%0A`;
            message += `Email: ${email || 'N/A'}%0A`;
            message += `Address: ${deliveryAddress}%0A%0A`;
            message += '*Order Items:*%0A';
            let subtotal = 0;
            orderItems.forEach(item => {
                const qty = item.quantity || 1;
                const price = parseFloat(item.price.replace(/[^0-9.]/g, '') || 0);
                subtotal += price * qty;
                message += `- ${item.name} (${item.price}) × ${qty}%0A`;
            });
            message += `%0A*Subtotal: ₦${subtotal.toFixed(2)}*%0A`;
            if (appliedCoupon) {
                message += `*Coupon Applied:* ${appliedCoupon.code} (${appliedCoupon.discount_type === 'percentage' ? appliedCoupon.discount_value + '%' : '₦' + appliedCoupon.discount_value})%0A`;
                message += `*You Saved:* ₦${discountAmount.toFixed(2)}%0A`;
            }
            message += `*Total: ₦${total.toFixed(2)}*%0A%0A`;
            if (deliveryNotes) message += `*Delivery Notes:* ${deliveryNotes}%0A%0A`;
            message += `Thank you for shopping with Awwalu Kitchen Vault! 🍳`;
            const whatsappNumber = '2348086111492';
            const url = `https://wa.me/${whatsappNumber}?text=${message}`;
            window.open(url, '_blank');

            // Log order
            const orderData = {
                customer_name: fullName,
                phone: phoneNumber,
                address: deliveryAddress,
                items: orderItems.map(i => `${i.name} × ${i.quantity || 1}`).join(', '),
                total: total.toFixed(2),
                coupon_code: appliedCoupon ? appliedCoupon.code : null
            };
            fetch(`${API_BASE}/admin/orders`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(orderData)
            }).catch(err => console.log('Order logging failed:', err));

            if (!productId) {
                localStorage.removeItem('awwalumart-cart');
                updateCartBadge();
            }
            showToast('✅ Order sent! We will confirm shortly.');
            setTimeout(() => window.location.href = 'products.html', 3000);
        });

        loadOrderItems();
        document.getElementById('fullName').focus();
    </script>
</body>

</html>
