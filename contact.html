<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Awwalumart - Contact</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <nav class="navbar" id="navbar"></nav>

    <section class="section">
        <div class="container">
            <h2 class="section-title">
                <i class="fas fa-envelope"></i> Get in Touch
            </h2>
            <div class="contact-grid">
                <div class="contact-card">
                    <i class="fab fa-whatsapp text-3xl text-green"></i>
                    <h3>WhatsApp</h3>
                    <p>Chat with us instantly</p>
                    <a href="https://wa.me/234XXXXXXXXX" class="btn-whatsapp" style="display:inline-block; margin-top:12px;">
                        <i class="fab fa-whatsapp"></i> Click to Chat
                    </a>
                </div>
                <div class="contact-card">
                    <i class="fas fa-envelope text-3xl text-blue"></i>
                    <h3>Email</h3>
                    <p>Send us a message</p>
                    <a href="mailto:awwalumart@gmail.com" class="btn-primary" style="display:inline-block; margin-top:12px;">
                        <i class="fas fa-envelope"></i> Send Email
                    </a>
                </div>
                <div class="contact-card">
                    <i class="fas fa-map-marker-alt text-3xl text-gray"></i>
                    <h3>Location</h3>
                    <p>Nigeria</p>
                    <p class="small">We deliver across the country!</p>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer" id="footer"></footer>

    <script src="script.js"></script>
    <script>
        loadNavbar();
        loadFooter();
        updateCartBadge();
    </script>
</body>
</html>
