<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Awwalumart - Home</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <!-- Navigation (included via JS or can be hardcoded) -->
    <nav class="navbar" id="navbar"></nav>

    <!-- Hero Section -->
    <section class="hero">
        <div class="container">
            <h1>Welcome to Awwalumart</h1>
            <p>Gadgets · Kitchenware · Essentials</p>
            <a href="products.html" class="btn-primary">
                <i class="fas fa-shopping-bag"></i> Shop Now
            </a>
        </div>
    </section>

    <!-- Categories -->
    <section class="section" id="categories">
        <div class="container">
            <h2 class="section-title">
                <i class="fas fa-th-large"></i> Shop by Category
            </h2>
            <div class="categories-grid" id="categoriesGrid">
                <!-- Cards will be populated by JS -->
            </div>
        </div>
    </section>

    <!-- Featured Products -->
    <section class="section" id="featured">
        <div class="container">
            <h2 class="section-title">
                <i class="fas fa-star"></i> Featured Products
            </h2>
            <div class="products-grid" id="featuredGrid">
                <!-- Populated by JS -->
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer" id="footer"></footer>

    <script src="script.js"></script>
    <script>
        // Load shared components
        loadNavbar();
        loadFooter();
        loadCategories();
        loadFeatured();
        updateCartBadge();
    </script>
</body>
</html>
