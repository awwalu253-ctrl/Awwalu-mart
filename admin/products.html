<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Products</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <nav class="admin-nav">
        <h1>🛠️ Admin Panel</h1>
        <div>
            <a href="/admin/dashboard.html">Dashboard</a>
            <a href="/admin/products.html" class="active">Products</a>
            <a href="/admin/coupons.html">Coupons</a>
            <a href="/admin/orders.html">Orders</a>
            <button id="logoutBtn">Logout</button>
        </div>
    </nav>
    <main class="admin-main">
        <div class="admin-header">
            <h2>📦 Product Management</h2>
            <button id="createProductBtn" class="btn-primary">+ Add New Product</button>
        </div>
        <div class="table-wrapper">
            <table id="productTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Image</th>
                        <th>Name</th>
                        <th>Price</th>
                        <th>Category</th>
                        <th>Stock</th>
                        <th>Featured</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="productList">
                    <tr><td colspan="8" style="text-align:center; padding:40px; color:#8a8078;">
                        <i class="fas fa-spinner spinner"></i> Loading products...
                    </td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- Product Modal -->
    <div id="productModal" class="modal">
        <div class="modal-content modal-large">
            <span class="close" id="modalClose">&times;</span>
            <h3 id="modalTitle">Add New Product</h3>
            <form id="productForm">
                <input type="hidden" id="editProductId">
                <div class="form-row">
                    <div class="form-group">
                        <label>Product ID <span class="required">*</span></label>
                        <input type="text" id="productId" placeholder="e.g. prod_001" required>
                    </div>
                    <div class="form-group">
                        <label>Product Name <span class="required">*</span></label>
                        <input type="text" id="productName" placeholder="e.g. Premium Cookware Set" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Price <span class="required">*</span></label>
                        <input type="text" id="productPrice" placeholder="e.g. ₦25,000" required>
                    </div>
                    <div class="form-group">
                        <label>Category <span class="required">*</span></label>
                        <select id="productCategory" required>
                            <option value="Cookware">Cookware</option>
                            <option value="Bakeware">Bakeware</option>
                            <option value="Utensils">Utensils</option>
                            <option value="Appliances">Appliances</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Image URL <span class="required">*</span></label>
                    <input type="url" id="productImage" placeholder="https://res.cloudinary.com/your-cloud/image/upload/product.jpg" required>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="productDescription" rows="2" placeholder="Product description"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Stock</label>
                        <select id="productStock">
                            <option value="Yes">In Stock</option>
                            <option value="No">Out of Stock</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Featured</label>
                        <select id="productFeatured">
                            <option value="No">No</option>
                            <option value="Yes">Yes</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn-primary">Save Product</button>
            </form>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin + '/api';
        const token = localStorage.getItem('adminToken');
        if (!token) window.location.href = '/admin/index.html';

        let isEditing = false;

        async function fetchWithAuth(url, options = {}) {
            const res = await fetch(url, {
                ...options,
                headers: {
                    ...options.headers,
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                }
            });
            if (res.status === 401) {
                localStorage.removeItem('adminToken');
                window.location.href = '/admin/index.html';
            }
            return res;
        }

        async function loadProducts() {
            const res = await fetch(`${API_BASE}/products`);
            const products = await res.json();
            const tbody = document.getElementById('productList');
            if (!products.length) {
                tbody.innerHTML = '<tr><td colspan="8" style="text-align:center; color:#8a8078;">No products found.</td></tr>';
                return;
            }
            tbody.innerHTML = products.map(p => `
                <tr>
                    <td><code>${p.id}</code></td>
                    <td><img src="${p.image}" alt="${p.name}" style="width:50px; height:50px; object-fit:cover; border-radius:8px;" onerror="this.style.display='none'"></td>
                    <td><strong>${p.name}</strong></td>
                    <td>${p.price}</td>
                    <td><span class="category-badge">${p.category}</span></td>
                    <td><span class="stock-badge ${p.stock === 'Yes' ? 'in-stock' : 'out-of-stock'}">${p.stock || 'Yes'}</span></td>
                    <td>${p.featured ? '⭐' : '—'}</td>
                    <td>
                        <button class="btn-primary btn-sm" onclick="editProduct('${p.id}')">Edit</button>
                        <button class="btn-danger btn-sm" onclick="deleteProduct('${p.id}')">Delete</button>
                    </td>
                </tr>
            `).join('');
        }

        document.getElementById('createProductBtn').addEventListener('click', () => {
            isEditing = false;
            document.getElementById('modalTitle').textContent = 'Add New Product';
            document.getElementById('productForm').reset();
            document.getElementById('editProductId').value = '';
            document.getElementById('productId').disabled = false;
            document.getElementById('productModal').style.display = 'flex';
        });

        document.getElementById('modalClose').addEventListener('click', () => {
            document.getElementById('productModal').style.display = 'none';
        });
        window.addEventListener('click', (e) => {
            if (e.target === document.getElementById('productModal')) {
                document.getElementById('productModal').style.display = 'none';
            }
        });

        async function editProduct(id) {
            isEditing = true;
            document.getElementById('modalTitle').textContent = 'Edit Product';
            const res = await fetch(`${API_BASE}/products/${id}`);
            const p = await res.json();
            if (p.error) {
                alert('Product not found');
                return;
            }
            document.getElementById('editProductId').value = id;
            document.getElementById('productId').value = p.id;
            document.getElementById('productId').disabled = true;
            document.getElementById('productName').value = p.name;
            document.getElementById('productPrice').value = p.price;
            document.getElementById('productCategory').value = p.category || 'Cookware';
            document.getElementById('productImage').value = p.image;
            document.getElementById('productDescription').value = p.description || '';
            document.getElementById('productStock').value = p.stock || 'Yes';
            document.getElementById('productFeatured').value = p.featured ? 'Yes' : 'No';
            document.getElementById('productModal').style.display = 'flex';
        }
        window.editProduct = editProduct;

        async function deleteProduct(id) {
            if (!confirm(`Delete product "${id}"? This cannot be undone.`)) return;
            await fetchWithAuth(`${API_BASE}/admin/products/${id}`, { method: 'DELETE' });
            loadProducts();
        }
        window.deleteProduct = deleteProduct;

        document.getElementById('productForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                id: document.getElementById('productId').value.trim(),
                name: document.getElementById('productName').value.trim(),
                price: document.getElementById('productPrice').value.trim(),
                category: document.getElementById('productCategory').value,
                image: document.getElementById('productImage').value.trim(),
                description: document.getElementById('productDescription').value.trim(),
                stock: document.getElementById('productStock').value,
                featured: document.getElementById('productFeatured').value
            };

            if (isEditing) {
                const id = document.getElementById('editProductId').value;
                await fetchWithAuth(`${API_BASE}/admin/products/${id}`, {
                    method: 'PUT',
                    body: JSON.stringify(data)
                });
            } else {
                await fetchWithAuth(`${API_BASE}/admin/products`, {
                    method: 'POST',
                    body: JSON.stringify(data)
                });
            }
            document.getElementById('productModal').style.display = 'none';
            loadProducts();
        });

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await fetchWithAuth(`${API_BASE}/admin/logout`, { method: 'POST' });
            localStorage.removeItem('adminToken');
            window.location.href = '/admin/index.html';
        });

        loadProducts();
    </script>
</body>
</html>
