<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <nav class="admin-nav">
        <h1>🛠️ Admin Panel</h1>
        <div>
            <a href="dashboard.html" class="active">Dashboard</a>
            <a href="coupons.html">Coupons</a>
            <a href="orders.html">Orders</a>
            <button id="logoutBtn">Logout</button>
        </div>
    </nav>
    <main class="admin-main">
        <h2>Dashboard</h2>
        <div class="stats-grid" id="stats">
            <!-- populated by JS -->
        </div>
        <div class="settings-card">
            <h3>⚙️ Maintenance Mode</h3>
            <div class="toggle-wrap">
                <label class="switch">
                    <input type="checkbox" id="maintenanceToggle">
                    <span class="slider"></span>
                </label>
                <span id="maintenanceStatus">Off</span>
            </div>
        </div>
    </main>
    <script>
        const API_BASE = window.location.origin + '/api';
        const token = localStorage.getItem('adminToken');
        if (!token) window.location.href = 'index.html';

        async function fetchWithAuth(url, options = {}) {
            const res = await fetch(url, {
                ...options,
                headers: { ...options.headers, 'Authorization': `Bearer ${token}` }
            });
            if (res.status === 401) {
                localStorage.removeItem('adminToken');
                window.location.href = 'index.html';
            }
            return res;
        }

        async function loadStats() {
            try {
                const ordersRes = await fetchWithAuth(`${API_BASE}/admin/orders`);
                const orders = await ordersRes.json();
                const couponsRes = await fetchWithAuth(`${API_BASE}/admin/coupons`);
                const coupons = await couponsRes.json();
                const maintRes = await fetchWithAuth(`${API_BASE}/admin/maintenance`);
                const maint = await maintRes.json();

                document.getElementById('stats').innerHTML = `
                    <div class="stat-card"><span>📦 Total Orders</span><strong>${orders.length}</strong></div>
                    <div class="stat-card"><span>🏷️ Active Coupons</span><strong>${coupons.filter(c => c.Active === 'Yes').length}</strong></div>
                    <div class="stat-card"><span>⚙️ Maintenance</span><strong>${maint.maintenance_mode === 'Yes' ? '🔴 ON' : '🟢 OFF'}</strong></div>
                `;
                document.getElementById('maintenanceToggle').checked = maint.maintenance_mode === 'Yes';
                updateStatusText();

                document.getElementById('maintenanceToggle').addEventListener('change', async (e) => {
                    const mode = e.target.checked ? 'Yes' : 'No';
                    await fetchWithAuth(`${API_BASE}/admin/maintenance`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ mode })
                    });
                    updateStatusText();
                });
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        function updateStatusText() {
            const checked = document.getElementById('maintenanceToggle').checked;
            document.getElementById('maintenanceStatus').textContent = checked ? '🟢 On' : '🔴 Off';
        }

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await fetchWithAuth(`${API_BASE}/admin/logout`, { method: 'POST' });
            localStorage.removeItem('adminToken');
            window.location.href = 'index.html';
        });

        loadStats();
    </script>
</body>
</html>
