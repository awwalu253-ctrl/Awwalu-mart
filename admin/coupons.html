<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Coupons</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <nav class="admin-nav">
        <h1>🛠️ Admin Panel</h1>
        <div>
            <a href="/admin/dashboard.html">Dashboard</a>
            <a href="/admin/products.html">Products</a>
            <a href="/admin/coupons.html" class="active">Coupons</a>
            <a href="/admin/orders.html">Orders</a>
            <button id="logoutBtn">Logout</button>
        </div>
    </nav>
    <main class="admin-main">
        <div class="admin-header">
            <h2>🏷️ Coupon Codes</h2>
            <button id="createCouponBtn" class="btn-primary">+ Create Coupon</button>
        </div>
        <div class="table-wrapper">
            <table id="couponTable">
                <thead>
                    <tr>
                        <th>Code</th>
                        <th>Type</th>
                        <th>Value</th>
                        <th>Expiry</th>
                        <th>Limit</th>
                        <th>Used</th>
                        <th>Active</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="couponList">
                    <tr><td colspan="8" style="text-align:center; color:#8a8078;">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- Coupon Modal -->
    <div id="couponModal" class="modal">
        <div class="modal-content">
            <span class="close" id="modalClose">&times;</span>
            <h3 id="modalTitle">Create Coupon</h3>
            <form id="couponForm">
                <input type="hidden" id="editCode">
                <div class="form-group">
                    <label>Coupon Code</label>
                    <input type="text" id="code" required>
                </div>
                <div class="form-group">
                    <label>Discount Type</label>
                    <select id="discountType">
                        <option value="percentage">Percentage</option>
                        <option value="fixed">Fixed Amount</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Discount Value</label>
                    <input type="number" id="discountValue" step="0.01" required>
                </div>
                <div class="form-group">
                    <label>Expiry Date</label>
                    <input type="date" id="expiryDate" required>
                </div>
                <div class="form-group">
                    <label>Usage Limit</label>
                    <input type="number" id="usageLimit" value="100" required>
                </div>
                <div class="form-group">
                    <label>Active</label>
                    <select id="active">
                        <option value="Yes">Yes</option>
                        <option value="No">No</option>
                    </select>
                </div>
                <button type="submit" class="btn-primary">Save</button>
            </form>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin + '/api';
        const token = localStorage.getItem('adminToken');
        if (!token) window.location.href = '/admin/index.html';

        let isEditing = false;

        async function fetchWithAuth(url, options = {}) {
            const res = await fetch(url, {
                ...options,
                headers: { ...options.headers, 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }
            });
            if (res.status === 401) {
                localStorage.removeItem('adminToken');
                window.location.href = '/admin/index.html';
            }
            return res;
        }

        async function loadCoupons() {
            const res = await fetchWithAuth(`${API_BASE}/admin/coupons`);
            const coupons = await res.json();
            const tbody = document.getElementById('couponList');
            if (!coupons.length) {
                tbody.innerHTML = '<tr><td colspan="8" style="text-align:center; color:#8a8078;">No coupons yet.</td></tr>';
                return;
            }
            tbody.innerHTML = coupons.map(c => `
                <tr>
                    <td><strong>${c.Code}</strong></td>
                    <td>${c['Discount Type']}</td>
                    <td>${c['Discount Value']}</td>
                    <td>${c['Expiry Date']}</td>
                    <td>${c['Usage Limit']}</td>
                    <td>${c['Used Count'] || 0}</td>
                    <td>${c.Active === 'Yes' ? '✅ Active' : '❌ Inactive'}</td>
                    <td>
                        <button class="btn-primary btn-sm" onclick="editCoupon('${c.Code}')">Edit</button>
                        <button class="btn-danger btn-sm" onclick="deleteCoupon('${c.Code}')">Delete</button>
                    </td>
                </tr>
            `).join('');
        }

        document.getElementById('createCouponBtn').addEventListener('click', () => {
            isEditing = false;
            document.getElementById('modalTitle').textContent = 'Create Coupon';
            document.getElementById('couponForm').reset();
            document.getElementById('editCode').value = '';
            document.getElementById('code').disabled = false;
            document.getElementById('couponModal').style.display = 'flex';
        });

        document.getElementById('modalClose').addEventListener('click', () => {
            document.getElementById('couponModal').style.display = 'none';
        });
        window.addEventListener('click', (e) => {
            if (e.target === document.getElementById('couponModal')) {
                document.getElementById('couponModal').style.display = 'none';
            }
        });

        async function editCoupon(code) {
            isEditing = true;
            document.getElementById('modalTitle').textContent = 'Edit Coupon';
            const res = await fetchWithAuth(`${API_BASE}/admin/coupons`);
            const coupons = await res.json();
            const c = coupons.find(c => c.Code === code);
            if (c) {
                document.getElementById('editCode').value = code;
                document.getElementById('code').value = c.Code;
                document.getElementById('code').disabled = true;
                document.getElementById('discountType').value = c['Discount Type'];
                document.getElementById('discountValue').value = c['Discount Value'];
                document.getElementById('expiryDate').value = c['Expiry Date'];
                document.getElementById('usageLimit').value = c['Usage Limit'];
                document.getElementById('active').value = c.Active;
                document.getElementById('couponModal').style.display = 'flex';
            }
        }
        window.editCoupon = editCoupon;

        async function deleteCoupon(code) {
            if (!confirm(`Delete coupon "${code}"?`)) return;
            await fetchWithAuth(`${API_BASE}/admin/coupons/${code}`, { method: 'DELETE' });
            loadCoupons();
        }
        window.deleteCoupon = deleteCoupon;

        document.getElementById('couponForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                code: document.getElementById('code').value.trim(),
                discount_type: document.getElementById('discountType').value,
                discount_value: document.getElementById('discountValue').value,
                expiry_date: document.getElementById('expiryDate').value,
                usage_limit: document.getElementById('usageLimit').value,
                active: document.getElementById('active').value
            };
            if (isEditing) {
                const orig = document.getElementById('editCode').value;
                await fetchWithAuth(`${API_BASE}/admin/coupons/${orig}`, {
                    method: 'PUT',
                    body: JSON.stringify(data)
                });
            } else {
                await fetchWithAuth(`${API_BASE}/admin/coupons`, {
                    method: 'POST',
                    body: JSON.stringify(data)
                });
            }
            document.getElementById('couponModal').style.display = 'none';
            loadCoupons();
        });

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await fetchWithAuth(`${API_BASE}/admin/logout`, { method: 'POST' });
            localStorage.removeItem('adminToken');
            window.location.href = '/admin/index.html';
        });

        loadCoupons();
    </script>
</body>
</html>
